background_opacity 0.82
dynamic_background_opacity yes

font_family      JetBrainsMono Nerd Font
font_size        11

# Netrunner theme (Cyberpunk 2077 breach protocol)
background            #0A0B10
foreground            #DCEAA0
cursor                 #5EF6FF
cursor_text_color      #0A0B10
cursor_shape           block
cursor_blink_interval  0.6
selection_background   #D0ED57
selection_foreground   #0A0B10
url_color               #5EF6FF
url_style               straight

window_padding_width   6
active_border_color    #D0ED57
inactive_border_color  #1F2430

tab_bar_style           separator
tab_separator           " ⁄⁄ "
tab_title_template      "{index}:{title}"
active_tab_background   #D0ED57
active_tab_foreground   #0A0B10
active_tab_font_style   bold
inactive_tab_background #0A0B10
inactive_tab_foreground #6B7A2E
tab_bar_background      #0A0B10

