background_opacity 0.82
dynamic_background_opacity yes

font_family      JetBrainsMono Nerd Font
font_size        11

# Cyberpunk 2077 breach-protocol look. Colours come from the active palette,
# rendered by netrunner-theme into the include at the bottom.
cursor_shape           block
cursor_blink_interval  0.6
# Neon smear behind the cursor when it jumps (kitty 0.37+)
cursor_trail                 3
cursor_trail_decay           0.1 0.4
cursor_trail_start_threshold 2
url_style              curly

window_padding_width   6
inactive_text_alpha    0.75

enable_audio_bell      no
visual_bell_duration   0.12
window_alert_on_bell   yes

# Slanted tabs, like the cut corners on the in-game panels
tab_bar_style           powerline
tab_powerline_style     angled
tab_title_template      "{index}▸{title}"
tab_activity_symbol     "⌁ "
active_tab_font_style   bold

include ~/.config/netrunner/current/kitty.conf
