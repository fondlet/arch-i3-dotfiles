# Generated by netrunner-theme from the @NR_THEME@ palette. dunst reads this
# drop-in after ~/.config/dunst/dunstrc, which holds the layout.

[global]
    frame_color = "@NR_ACCENT@"
    background = "@NR_BG@"
    foreground = "@NR_ACCENT@"
    highlight = "@NR_ACCENT@"
    # Small dim app tag above the summary, like the panel captions in the HUD
    format = "<span size='small' foreground='@NR_ACCENT_DIM@'>// %a</span>\n<b>%s</b>\n<span foreground='@NR_ACCENT_SOFT@'>%b</span>"

[urgency_low]
    background = "@NR_BG@"
    foreground = "@NR_ACCENT_MUTED@"
    frame_color = "@NR_ACCENT_DARK@"
    highlight = "@NR_ACCENT_DIM@"

[urgency_normal]
    background = "@NR_BG@"
    foreground = "@NR_ACCENT@"
    frame_color = "@NR_ACCENT@"

[urgency_critical]
    background = "@NR_ALERT_BG@"
    foreground = "@NR_ALERT@"
    frame_color = "@NR_ALERT@"
    highlight = "@NR_ALERT@"
    format = "<span size='small' foreground='@NR_ALERT@'>// ALERT :: %a</span>\n<b>%s</b>\n<span foreground='@NR_ALERT_SOFT@'>%b</span>"

[volume]
    appname = volume
    format = "<span size='small' foreground='@NR_ACCENT_DIM@'>// SYS.AUDIO_OUT</span>\n<b>%s</b>  <span foreground='@NR_HI@'>%b</span>"
    history_ignore = yes

[brightness]
    appname = brightness
    format = "<span size='small' foreground='@NR_ACCENT_DIM@'>// SYS.DISPLAY</span>\n<b>%s</b>  <span foreground='@NR_HI@'>%b</span>"
    history_ignore = yes

# Sent by /usr/local/bin/netrunner-pkg-notify (extras/pacman) after installs
[pacman]
    appname = pacman
    frame_color = "@NR_HI@"
    format = "<span size='small' foreground='@NR_HI@'>// STREET CRED +1</span>\n<b>%s</b>\n<span foreground='@NR_ACCENT_SOFT@'>%b</span>"

[killmode]
    appname = killmode
    format = "<span size='small' foreground='@NR_ALERT@'>// KIROSHI OPTICS :: KILL MODE</span>\n<b>%s</b>\n<span foreground='@NR_ALERT_SOFT@'>%b</span>"

[netrunner]
    appname = netrunner
    frame_color = "@NR_HI@"
    format = "<span size='small' foreground='@NR_ACCENT_DIM@'>// SYS.PALETTE</span>\n<b>%s</b>  <span foreground='@NR_HI@'>%b</span>"
    history_ignore = yes
