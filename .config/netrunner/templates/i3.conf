# Generated by netrunner-theme from the @NR_THEME@ palette. Edit
# ~/.config/netrunner/themes/@NR_THEME@.sh, then run netrunner-theme.
# The colours are written out here because i3 does not pass variables set in
# an included file back to the file that includes it.

# class                   border           backgr.          text             indicator        child_border
client.focused            @NR_ACCENT@      @NR_ACCENT@      @NR_BG@          @NR_HI@          @NR_ACCENT@
client.focused_inactive   @NR_ACCENT_DARK@ @NR_BG_PANEL@    @NR_ACCENT_DIM@  @NR_ACCENT_DARK@ @NR_ACCENT_DARK@
client.unfocused          @NR_BG_ROW@      @NR_BG@          @NR_ACCENT_DIM@  @NR_BG_ROW@      @NR_BG_ROW@
client.urgent             @NR_ALERT@       @NR_ALERT@       @NR_BG@          @NR_ALERT@       @NR_ALERT@
client.placeholder        @NR_BG@          @NR_BG@          @NR_ACCENT_DIM@  @NR_BG@          @NR_BG@
client.background         @NR_BG@

# Workspace bar. The i3blocks config is rendered from templates/i3blocks.conf.
bar {
        status_command i3blocks -c ~/.config/netrunner/current/i3blocks.conf
        position bottom
        tray_output primary
        font pango:Iosevka Nerd Font Bold 10
        height 24
        workspace_min_width 36
        separator_symbol " ⁄⁄ "

        colors {
                background @NR_BG@
                statusline @NR_ACCENT@
                separator  @NR_ACCENT_DARK@

                focused_workspace  @NR_ACCENT@     @NR_ACCENT@   @NR_BG@
                active_workspace   @NR_ACCENT_DIM@ @NR_BG_PANEL@ @NR_ACCENT@
                inactive_workspace @NR_BG@         @NR_BG@       @NR_ACCENT_DIM@
                urgent_workspace   @NR_ALERT@      @NR_ALERT@    @NR_BG@
                binding_mode       @NR_HI@         @NR_BG@       @NR_HI@
        }
}
