# Generated by netrunner-theme from the @NR_THEME@ palette; the template lives in
# ~/.config/netrunner/templates/i3blocks.conf.
# Dim tags, accent readouts, highlighted clock.
# Separators come from i3bar's separator_symbol in ~/.config/i3/config.
separator=true
separator_block_width=15
markup=pango
color=@NR_ACCENT@

[spotify]
label=<span foreground='@NR_ACCENT_DIM@'>󰓇 AUDIO </span>
command=$HOME/.config/i3/script/spotify.sh
interval=5

[wifi]
label=<span foreground='@NR_ACCENT_DIM@'>󰖩 NET </span>
command=nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 | sed 's/&/\&amp;/g; s/</\&lt;/g'
interval=10

[ip]
label=<span foreground='@NR_ACCENT_DIM@'>󰩠 IP </span>
command=ip addr | grep -E 'inet\s' | grep -v '127.0.0.1' | awk '{print $2}' | cut -d/ -f1 | head -n1
interval=10

[battery]
label=<span foreground='@NR_ACCENT_DIM@'>PWR </span>
# Icon reflects actual charge level (battery.sh picks the matching Nerd Font glyph)
command=$HOME/.config/i3/script/battery.sh
interval=30

[disk]
label=<span foreground='@NR_ACCENT_DIM@'>󰋊 DSK </span>
command=df -h / | awk '/\// {print $4}'
interval=30

[memory]
label=<span foreground='@NR_ACCENT_DIM@'>󰍛 MEM </span>
command=free -h | awk '/Mem:/ {print $3}'
interval=10

[time]
label=<span foreground='@NR_ACCENT_DIM@'>󰅐 </span>
command=date '+%Y.%m.%d <span foreground="@NR_ACCENT_DIM@">//</span> %I:%M %p'
interval=5
color=@NR_HI@
