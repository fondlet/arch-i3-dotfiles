backend = "glx";
vsync = true;

# subtle blur behind translucent windows (kitty)
# blur-method = "dual_kawase";
# blur-strength = 5;
# blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "class_g = 'flameshot'" ];

shadow = false;
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

# CRT power-off when a window closes: it collapses into a horizontal line, then
# into a dot, like an old monitor switching off. Opening keeps the plain fade.
# 0.2 s in total, so it costs a few frames per close on battery.
animations = ({
    triggers = [ "close" ];
    scale-y = { duration = 0.12; start = 1; end = 0.01; curve = "cubic-bezier(0.55, 0, 1, 0.45)"; };
    scale-x = { delay = 0.12; duration = 0.08; start = 1; end = 0; curve = "linear"; };
    offset-y = "(1 - scale-y) * window-height / 2";
    offset-x = "(1 - scale-x) * window-width / 2";
    opacity = { delay = 0.12; duration = 0.08; start = "window-raw-opacity-before"; end = 0; };
    shadow-opacity = "opacity";
});

# only kitty gets transparency (from its own background_opacity); keep everything else solid
opacity-rule = [ ];
